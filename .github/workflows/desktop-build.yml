name: Desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/package-*'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Configure signed updates
        run: node scripts/configure-updates.mjs
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run desktop:build
      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: npm run desktop:build -- --config src-tauri/tauri.macos.conf.json
      - name: Verify packaged macOS runtime
        if: runner.os == 'macOS'
        run: npm run runtime:verify -- 'src-tauri/target/release/bundle/macos/Pi Desktop.app/Contents/Resources/runtime'
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil verify src-tauri/target/release/bundle/dmg/*.dmg
      - name: Collect versioned installers
        shell: bash
        run: |
          package_version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          mkdir release-assets
          if [ '${{ runner.os }}' = 'Windows' ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe "release-assets/Pi-Desktop_${package_version}_windows-x64-setup.exe"
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_UPDATER_PUBLIC_KEY" ]; then
              cp src-tauri/target/release/bundle/nsis/*.exe.sig "release-assets/Pi-Desktop_${package_version}_windows-x64-setup.exe.sig"
            fi
          else
            cp src-tauri/target/release/bundle/dmg/*.dmg "release-assets/Pi-Desktop_${package_version}_${{ matrix.platform }}.dmg"
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_UPDATER_PUBLIC_KEY" ]; then
              cp src-tauri/target/release/bundle/macos/*.app.tar.gz "release-assets/Pi-Desktop_${package_version}_${{ matrix.platform }}.app.tar.gz"
              cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig "release-assets/Pi-Desktop_${package_version}_${{ matrix.platform }}.app.tar.gz.sig"
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Pi-Desktop-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: release-assets/*

  release:
    name: Publish signed update channel
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: Pi-Desktop-*
          merge-multiple: true
          path: release-assets
      - name: Generate complete update manifest
        run: node scripts/update-manifest.mjs
      - name: Publish release after both platforms are ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Upload to a draft so the stable endpoint never sees a partial release.
          # Refuse to replace assets of an existing release; updates are immutable.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "Pi Desktop $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" --draft --prerelease
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "Pi Desktop $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" --draft
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
